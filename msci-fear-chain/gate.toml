"alt:mf-2-flows.png" = "Bar chart of net foreign purchases of Indonesian shares over the quarter of each IHSG shock and the next, in US dollars. There were net outflows around {{links.L3.n_meeting:words}} of {{links.L3.n:words}} episodes, including {{episodes[month0=2026-03].flows.outflow_usd_bn:dec1}} billion around the March {{episodes[month0=2026-03].year:year}} episode; the quarter of the October {{october_2026.shock_day_y:year}} fall is not yet published."
"alt:mf-3-prices.png" = "Dumbbell chart of consumer price inflation over the {{rules.inflation_window_months:words}} months up to and after each rupiah slide. Prices rose after {{household.prices_rose.n_meeting:words}} of {{household.prices_rose.n:words}} slides; inflation was {{rules.inflation_gap_pp:int}} percentage points or more higher after {{links.L4.n_meeting:words}} of {{links.L4.n:words}}, after August {{slides[start=2005-08].year:year}}. Rows under the chart count the government's changes to Premium and Solar prices in each window. The {{slides[start=1997-09].year:year}} slide, shown apart and not counted: inflation went from {{slides[start=1997-09].inflation_before_pct:dec1}} to {{slides[start=1997-09].inflation_after_pct:dec1}} percent."
"alt:mf-4-savings-loans.png" = "Bar charts for each counted rupiah slide. Top: the buying power of a one-month rupiah deposit after tax, {{household.rules.deposit_months:words}} months on; it fell after {{household.L5.verdict.n_meeting:words}} of {{household.L5.verdict.n:words}} slides, May {{slides[start=2004-05].year:year}} and August {{slides[start=2005-08].year:year}}. Bottom: the change in the average consumer-loan rate over {{household.rules.deposit_months:words}} months; it rose a point or more after {{household.L6.verdict.n_meeting:words}} of {{household.L6.verdict.n:words}}, after August {{slides[start=2005-08].year:year}}."
