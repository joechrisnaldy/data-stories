"seoTitle" = "What Should My Family Worry About If MSCI Drops Indonesia? - Jonathan Chrisnaldy"
"excerpt" = "MSCI has proposed moving Indonesia to Standalone status, and people fear a chain: stocks crash and stay down, the rupiah falls, foreign money leaves, prices rise faster. Against Indonesia's own record, foreign money left Indonesian shares around {{links.L3.n_meeting:words}} of {{links.L3.n:words}} past shocks, but the index was back above its pre-shock level a year later in {{links.L1.n_not_meeting:words}} of {{links.L1.n:words}}; inflation sped up by {{rules.inflation_gap_pp:int}} percentage points or more after {{links.L4.n_meeting:words}} of {{links.L4.n:words}} rupiah slides, a bank deposit lost buying power after {{household.L5.verdict.n_meeting:words}} of {{household.L5.verdict.n:words}}, and consumer-loan rates rose a point or more after {{household.L6.verdict.n_meeting:words}} of {{household.L6.verdict.n:words}}."
"metaDescription" = "Testing the MSCI downgrade fear against Indonesia's own history: foreign money left Indonesian shares around {{links.L3.n_meeting:words}} of {{links.L3.n:words}} past shocks; the rupiah was {{rules.rupiah_weaker:pct0}} percent or more weaker {{rules.rupiah_horizon_months:words}} months on after a minority of them, and inflation sped up by {{rules.inflation_gap_pp:int}} percentage points or more, a deposit lost buying power and consumer-loan rates rose a point or more after a minority of rupiah slides."
