# ---------------------------------------------------------------------------------------------------
# [pairs]: paragraphs that set like-for-like figures from different samples side by side while relying
# on an n stated elsewhere. Each says where.
[pairs]
"Bitcoin fell further in each" = {reason = "each episode's two figures share a window; the three episodes are different windows by construction, defined in the previous paragraph, and the comparison is within each episode", paths = ["episodes[peak_year=2020].bitcoin", "episodes[peak_year=2020].sp500", "episodes[peak_year=2022].bitcoin", "episodes[peak_year=2022].sp500", "episodes[peak_year=2025].bitcoin", "episodes[peak_year=2025].sp500"]}

# ---------------------------------------------------------------------------------------------------
# [published]: templates for the MDX's hand-written fields. The gate renders each and requires it to
# equal what is live. Figures here are bound exactly like the draft's.
[published]
"seoTitle" = "The Dip I Waved Away - Jonathan Chrisnaldy"
"excerpt" = "In late 2020 I wrote that Bitcoin was more stable and safer than Indonesia's LQ45 stocks. I saw the dip and waved it away. Here is the test I should have run, against the S&P 500 and gold."
"metaDescription" = "My 2020 draft called Bitcoin safer than LQ45 stocks. On the S&P 500's worst {{rules.worst_days:pct0}} percent of days from {{meta.start_year:year}} to {{meta.daily_end_year:year}}, Bitcoin's average log return was {{worst_days.primary.bitcoin.mean_pct:signed1}} percent. A safe-haven test anyone can run, with gold for comparison."
"alt:sh-1-window.png" = "Line chart of Bitcoin and the S&P 500 from 5 March to 5 May 2020, both indexed to 100 on the first day. Bitcoin's largest fall inside the window was {{window_2020.bitcoin.fall:pct0}} percent, bottoming on {{window_2020.bitcoin.low_day:int}} March; the S&P 500's largest fall was {{window_2020.sp500.fall:pct0}} percent. Bitcoin ended the window at {{window_2020.bitcoin.return_pct:signed1}} percent and the S&P 500 at {{window_2020.sp500.return_pct:signed1}} percent."
"alt:sh-2-safe-haven-test.png" = "Strip charts. Left: Bitcoin's log return on each of the S&P 500's worst {{rules.worst_days:pct0}}% of days, {{worst_days.primary.n:int}} days, averaging {{worst_days.primary.bitcoin.mean_pct:signed1}} percent against the S&P 500's {{worst_days.primary.sp500_mean_pct:signed1}}. Middle and right: Bitcoin's and gold's log change in calendar-month averages in the S&P 500's worst {{rules.worst_months:pct0}}% of months, {{monthly.worst10.n:int}} months, averaging {{monthly.worst10.bitcoin.mean_pct:signed1}} and {{monthly.worst10.gold.mean_pct:signed1}} percent against the S&P 500's {{monthly.worst10.sp500_mean_pct:signed1}}. Thick horizontal bars mark the averages and thin vertical bars their {{rules.confidence:pct0}}% confidence intervals."
"alt:sh-3-episodes.png" = "Horizontal bar chart of Bitcoin's and the S&P 500's largest fall between the S&P 500's high and its low, in the {{meta.n_episodes:words}} S&P 500 falls of {{rules.episode_fall:pct0}}% or more since 2020. Bitcoin fell further in each: {{episodes[peak_year=2020].bitcoin.fall:pct0}} percent against {{episodes[peak_year=2020].sp500.fall:pct0}} across the {{episodes[peak_year=2020].sp500.n:int}} S&P 500 closes from the {{episodes[peak_year=2020].peak_year:year}} fall's high to its low, {{episodes[peak_year=2022].bitcoin.fall:pct0}} against {{episodes[peak_year=2022].sp500.fall:pct0}} across the {{episodes[peak_year=2022].sp500.n:int}} closes of the {{episodes[peak_year=2022].peak_year:year}} fall, and {{episodes[peak_year=2025].bitcoin.fall:pct0}} against {{episodes[peak_year=2025].sp500.fall:pct0}} across the {{episodes[peak_year=2025].sp500.n:int}} of the {{episodes[peak_year=2025].peak_year:year}} fall."
"alt:sh-4-rolling.png" = "Line chart of the correlation of log changes in calendar-month averages with the S&P 500 over rolling {{rules.roll_months:int}}-month windows ending January {{monthly.rolling.bitcoin.first_year:year}} to April {{meta.last_month_year:year}}. Bitcoin's stays between {{monthly.rolling.bitcoin.min:dec2}} and {{monthly.rolling.bitcoin.max:dec2}}; gold's ranges between {{monthly.rolling.gold.min:signed2}} and {{monthly.rolling.gold.max:dec2}}. Over the whole period the correlations are {{monthly.hedge.bitcoin.r:dec2}} for Bitcoin and {{monthly.hedge.gold.r:dec2}} for gold."
