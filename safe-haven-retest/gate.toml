# Gate configuration for Post 26. Run from Projects/analytics-blog:  python3 -m gate safe-haven-retest
[post]
slug = "the-dip-i-waved-away"
source = "draft/the-dip-i-waved-away.src.md"
rendered = "draft/the-dip-i-waved-away.md"
results = "results.json"
sources = "docs/sources.json"
build = ["build_analysis.py"]
charts = "make_charts.py"
chart_dir = "charts"
docx = "draft/the-dip-i-waved-away.docx"
mdx = "../../joechrisnaldy-portfolio/site/src/content/blog/the-dip-i-waved-away.mdx"
extra = [["docs/README.src.md", "README.md"], ["docs/data-README.src.md", "data/README.md"]]

