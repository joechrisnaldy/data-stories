# ---------------------------------------------------------------------------------------------------
# [claims]: the register of universal, superlative and causal sentences, each with what licenses it.
# Round 1's logic lens reviews THIS list.
[claims]
"I never finished it" = "the 2020 draft has a chapter one and headings for the rest (sources/2020-draft.txt)"
"worst 5 percent of days" = "definition of the test: the S&P 500's lowest k daily log returns, k = 5% of returns rounded up (build_analysis.worst_periods; rules.worst_days)"
"worst 5 percent of the remaining days" = "the same definition on the sample without the 2020 crash (worst_days.without_crash)"
"worst 1 percent of days" = "the same definition at 1% (worst_days.worst1)"
"worst 1 percent of two-day periods" = "the same definition at 1% on two-day returns (worst_days.two_day_worst1_pairing1 and _pairing2)"
"worst 10 percent of months" = "the S&P 500's lowest k monthly log changes, k = 10% rounded up (monthly.worst10, monthly.ex2020)"
"worst 20 percent of months" = "the same at 20% (monthly.worst20)"
"worst 5% of days" = "chart wording of 'worst 5 percent of days'"
"worst 10% of months" = "chart wording of 'worst 10 percent of months'"
"the market's worst days" = "Baur and Lucey (2006) and Baur and McDermott (2009) condition on the lowest return quantiles (sources, provenance audit)"
"the stock market's worst days" = "the test's step 1, defined in the same list as the S&P 500's worst 5 percent of days"
"The worst days" = "section heading for the worst-days and worst-months tests"
"worst days and months" = "chart 2 title: the two tests just defined"
"the worst-days test" = "the test defined in the post's numbered list"
