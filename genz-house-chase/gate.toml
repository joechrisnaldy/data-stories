# ---------------------------------------------------------------------------------------------------
# [claims]: every universal, superlative or causal phrase, with the result key or source that licenses it.
[claims]
"because their savings could catch up with the price" = "the owner's stated view, his words of 2026-11-09: 'can save money, to buy home because the saving can catch up the housing'; the post tests it (design R1 to R7)"
"Gen Z can't." = "the owner's stated view, his words of 2026-11-09: 'for Gen Z it's not'; tested by design R6 and R7"
"Gen Z can't, so small spending is rational" = "the owner's stated view, his words of 2026-11-09 (README summary of the opening)"
"every later change dated" = "docs/2026-11-09-genz-house-chase-design.md section 10: each amendment carries its date"
"the oldest of Gen Z" = "src pew_genz (born from 1997) and chase.generations.genz.first_start, the first Gen Z birth year plus 25"
"In all nine versions I ran" = "robustness.all_millennials_longer is true across robustness.n versions (results.json)"
"Both rates count only people who head a household" = "HVS definitions: the homeownership rate divides owner households by households (sources/income/ann25def.pdf p. 9; docs/provenance-audit.md)"
"the closest it comes is snacks and nonalcoholic drinks bought away from home" = "design R10, owner-approved; the sentence is scoped to a drink bought out: among items bought away from home, data/bls_cx_item.txt lists no drink item narrower by product than SNKNABEV, whose child items split it by place of purchase only"
"the jobs most exposed to AI" = "Brynjolfsson et al. (2026): the most exposed occupational quintiles (sources/ai/stanford_Canaries_August2026.pdf p7; docs/provenance-audit.md)"
"rather than proving a cause" = "Brynjolfsson et al. (2026) say the work is descriptive and not causal (stored PDF p1, p4, p5; docs/provenance-audit.md)"
"The data I have can't show it." = "design R14: the New York Fed series and the other stored data measure outcomes by group and identify no cause"
"publishes no house prices in rupiah, only an index" = "Bank Indonesia's metadata: 'Data harga dinyatakan dalam bentuk indeks' (docs/provenance-audit.md, Bank Indonesia section)"
"so I can't run the chase there" = "design R15: with no price levels there is no down payment to chase"
"it has been above every month" = "grads.streak: each month from streak.start_year and streak.start_month through the file's last month (results.json)"
"the rate for all workers" = "the New York Fed's series name 'All workers' (data/nyfed_college_labor_unemployment.csv header; docs/provenance-audit.md)"
"for all workers" = "the New York Fed's series name 'All workers' (data/nyfed_college_labor_unemployment.csv header)"
"recent college graduates and all workers" = "the New York Fed's series names 'Recent graduates' and 'All workers' (data file header)"
"and of all workers" = "the New York Fed's series name 'All workers' (data file header)"
"all workers: aged 16 to 65" = "the New York Fed's definition of the all-workers series (docs/provenance-audit.md)"
"all workers" = "the New York Fed's series name 'All workers' (chart 4 line label)"
"all consumer units" = "the CE's group 'All Consumer Units' (data/bls_cx_characteristics.txt, LB04 code 01)"
"recent graduates above all workers every month since January" = "grads.streak: each month from the streak's start through the file's last month (results.json)"
"have been above all workers in every month since January" = "grads.streak: each month from the streak's start through the file's last month (results.json)"
"The ChatGPT line is a date, not a cause." = "design R14: the chart marks a date and makes no causal claim"
"The AI chart shows timing, not cause." = "design R14: the chart marks a date and makes no causal claim"
"New houses only, built for sale" = "Census SOC definitions and scope: new houses built for sale (docs/provenance-audit.md)"
"House Price Index, all transactions" = "the FHFA index's name (all-transactions)"
"House Price Index, all-transactions" = "the FHFA index's name (all-transactions)"
"Every BLS file is an Internet Archive copy" = "the round 1 source lens found each capture's digest equal to the stored file, directly or after gzip decoding (docs/round1-verdicts.json, item 118)"
"Every BLS file here is an Internet Archive copy" = "the round 1 source lens found each capture's digest equal to the stored file, directly or after gzip decoding (docs/round1-verdicts.json, items 118 and 240)"
"All-transactions indexes, United States and census divisions" = "the FHFA data set's title"
"retroactive series using current methods (R-CPI-U-RS), all items" = "the BLS homepage's name for the series (sources/wages/r-cpi-u-rs-home.htm), with the workbook's All items label"
"Consumer Price Index for All Urban Consumers (CPI-U), U.S. city average, all items" = "the BLS series title"
"Median and mean household income of all households by age of householder" = "the Census table's title"
"cost young households at most" = "treats.narrow.max_target_pct is the largest share over the years of the narrow line (results.json)"
"including those that buy none" = "BLS CE Tables Getting Started Guide: the published estimates are the share for all CUs in the sample, including those that did not make the expenditure in question (sources/spending/tables-getting-started-guide.htm)"
"disallows all automated agents" = "sources/wages/robots_api.bls.gov.txt reads 'User-agent: *' and 'Disallow: /'"

