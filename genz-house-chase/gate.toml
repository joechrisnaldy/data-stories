[published]
"seoTitle" = "Skip the Matcha, Still No House - Jonathan Chrisnaldy"
"excerpt" = "In {{ratio.household.first_year:year}}, the typical new US home cost {{ratio.household.first:dec1}} years of income for a household headed by someone aged 25 to 34. In {{ratio.household.last_year:year}}, it cost {{ratio.household.last:dec1}}. I tested whether a young saver can still catch up with a house, and whether skipping treats would help."
"metaDescription" = "Can young Americans still save their way to a house? I chased a down payment for each year a saver turned 25 since {{chase.rules.first_start:year}}, and tested whether skipping treats would help."
"alt:gz-1-years-of-pay.png" = "Line chart, {{ratio.household.first_year:year}} to {{ratio.household.last_year:year}}, of the median new-home price in years of pay. For households headed by someone aged 25 to 34, a line over {{ratio.household.n:words}} years, it is {{ratio.household.first:dec1}} years of income in {{ratio.household.first_year:year}} and {{ratio.household.last:dec1}} in {{ratio.household.last_year:year}}, with a peak of {{ratio.household.max:dec1}} in {{ratio.household.max_year:year}}. For one full-time salary at 25 to 34, a line over {{ratio.salary.n:words}} years, it is {{ratio.salary.first:dec1}} years in {{ratio.salary.first_year:year}} and {{ratio.salary.last:dec1}} in {{ratio.salary.last_year:year}}."
"alt:gz-2-chase.png" = "Bar chart of the years of saving it took to reach a {{chase.rules.down_pct:dec0}} percent down payment on the typical new home, putting aside {{chase.rules.share_pct:dec0}} percent of income, by the year the saver turned 25, from {{chase.rules.first_start:year}} to {{chase.rules.last:year}}; chases still running show the years so far. Boomer chases took a median of {{chase.generations.boomers.finished.median_years:words}} years across {{chase.generations.boomers.n:words}} start years, and Gen X chases {{chase.generations.genx.finished.median_years:words}} across {{chase.generations.genx.n:words}}. The {{chase.generations.millennials.finished.n:words}} Millennial chases that finished took a median of {{chase.generations.millennials.finished.median_years:words}}. No Gen Z chase has finished yet. Dots show the same if eating out, entertainment and personal care were saved too."
"alt:gz-3-treat-share.png" = "Line chart, {{shares.all.first_year:year}} to {{shares.all.last_year:year}}, of the share of average annual spending that goes on eating out, entertainment and personal care. For households aged 25 to 34 it is {{shares.age25_34.first_pct:dec1}} percent in {{shares.age25_34.first_year:year}} and {{shares.age25_34.last_pct:dec1}} percent in {{shares.age25_34.last_year:year}}; the lines for households under 25 and for households of any age also end lower than they start."
"alt:gz-4-recent-grads.png" = "Line chart of the monthly unemployment rate of recent college graduates, aged 22 to 27, and of all workers, from {{grads.early.first:year}} to {{grads.streak.end_year:year}}, from the New York Fed. Recent graduates have been above all workers in every month since January {{grads.streak.start_year:year}}, before ChatGPT's release in November {{grads.chatgpt_release_year:year}}."
