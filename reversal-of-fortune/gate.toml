"because there is no" = "no country-level instrumental or reanalysis climatology exists for 1500"
"deleted from every correlation" = "verified rounds 2 and 4: DEU and ZWE dropped from every correlation needing density or income"
"so it removed nothing" = "round 1: the filter removed 0 of 265 rows (design doc 6.1)"
