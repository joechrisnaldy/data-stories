# ---------------------------------------------------------------------------------------------------
# [pairs]: paragraphs that set like-for-like figures from different samples side by side while relying
# on an n stated elsewhere. Each says where. Deliberately not fixable here, because it is a real defect in
# the live post: the chart 3 alt text gives the pooled r without its n (163).
[pairs]
"Two things worth saying" = {reason = "tidy_story's 196 is stated in the paragraph immediately above; the 159-country sample is named in its own sentence", paths = ["tidy_story"]}
"Two transforms, both load-bearing" = {reason = "logged against unlogged density within each group; the group sizes, 94 and 69, are stated in the body's flip section", paths = ["flip.density_1500|income_2023|former_colonies", "flip_raw_density.former_colonies", "flip_raw_density.never_colonised"]}

# ---------------------------------------------------------------------------------------------------
# [published]: templates for the MDX's hand-written fields. The gate renders each and requires it to
# equal what is live. Figures here are bound exactly like the draft's.
[published]
"seoTitle" = "The Map Used to Run the Other Way - Jonathan Chrisnaldy"
"excerpt" = "A chart of temperature against national income is one of the tidiest things in economics, and it is real. It is also impossible to read the way it invites you to, because among former colonies the same thermometer used to point the other way."
"metaDescription" = "Temperature correlates with national income at {{tidy_story.r:signed2}}. Among former European colonies the same thermometer ran the other way in 1500. What a reversal rules out, and what it does not."
"alt:rf-1-the-tidy-story.png" = "Scatter plot of average annual temperature against GDP per capita on a log scale for {{tidy_story.n:int}} countries and territories, with a downward-sloping fitted line. Hot countries cluster at low incomes, cold countries at high ones. The correlation on log income is {{tidy_story.r:signed2}}. Singapore, Qatar and Indonesia sit above the line at high temperatures; Norway and Mongolia are labelled in the cold half."
"alt:rf-2-the-same-heat-in-1500.png" = "Two scatter plots side by side, both for former European colonies. On the left, temperature against log population density in 1500, sloping upward, correlation {{heat_reversal.former_colonies.vs_density_1500.r:signed2}} across {{heat_reversal.former_colonies.vs_density_1500.n:int}} countries. On the right, temperature against log GDP per capita today, sloping downward, correlation {{heat_reversal.former_colonies.vs_income_2023.r:signed2}} across {{heat_reversal.former_colonies.vs_income_2023.n:int}}. The same thermometer points opposite ways five centuries apart."
"alt:rf-3-the-flip.png" = "Two scatter plots of log population density in 1500 against GDP per capita today on a log scale. The left panel, places Europeans colonised, slopes downward at {{flip.density_1500|income_2023|former_colonies.r:signed2}} across {{flip.density_1500|income_2023|former_colonies.n:int}} countries. The right panel, places not on AJR's list, slopes upward at {{flip.density_1500|income_2023|never_colonised.r:signed2}} across {{flip.density_1500|income_2023|never_colonised.n:int}}. Pooled across both the relationship is {{flip.density_1500|income_2023|all.r:signed2}} and invisible."
"alt:rf-4-who-actually-reversed.png" = "Dumbbell chart of 15 former colonies. Each row runs from a circle marking the country's percentile by population density in 1500 to a diamond marking its percentile by income today. Burundi falls from the {{ranks[iso3=BDI].density_pct:ordinal0}} percentile to the {{ranks[iso3=BDI].income_pct:ordinal0}}, Sudan from the {{ranks[iso3=SDN].density_pct:ordinal0}} to the {{ranks[iso3=SDN].income_pct:ordinal0}}, Afghanistan from the {{ranks[iso3=AFG].density_pct:ordinal0}} to the {{ranks[iso3=AFG].income_pct:ordinal0}}. Singapore, Canada, Australia, Hong Kong SAR, the United States and Uruguay climb from the bottom of the distribution to the top. Indonesia, in amber, moves only from the {{indonesia.density_pct:ordinal0}} to the {{indonesia.income_pct:ordinal0}}."
