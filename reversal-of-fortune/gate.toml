# ---------------------------------------------------------------------------------------------------
# [claims]: the register of universal, superlative and causal sentences, each with what licenses it.
# Round 1's logic lens reviews THIS list. Deliberately left unregistered, because they look wrong:
#   "Income is logged in every correlation."  (chart 1 reports a raw-dollar r of -0.39 on 196)
#   "Across all countries, temperature against 1500 density" and "minus 0.18 across all countries"
#       (n = 173, the countries in AJR's file with both measures; the post's own universe is 196)
[claims]
"the wealth of nations explained by a thermometer" = "describes the reading the post disputes"
"every place with both" = "tidy_story.n: every entity with both series (196, bound in the same sentence)"
"impossible to read the way it invites you to" = "the thesis, hedged 'I think'; argued from interaction.t and the heat reversal"
"Nothing in this post disputes that the correlation is real" = "tidy_story.r, t = -6.7 on 196; no section disputes it"
"not even the strongest crude variable available" = "of the three compared on rivals_common_sample (n = 159): |africa| 0.68 > |lat_abst| 0.60 > |tas| 0.46; the next sentence names them"
"Nobody measured GDP in 1500" = "national accounts did not exist; later figures for 1500 are reconstructions, not measurements"
"only a relatively productive place could feed a dense population" = "AJR's argument, p. 1232: 'only relatively prosperous areas could support dense populations'"
"only places with high agricultural productivity" = "AJR p. 1232, citing Bairoch and de Vries"
"because I pre-registered this chart as a global claim" = "design doc section 4; heat_vs_1500_density.r"
"Across all 163 countries with both" = "flip density_1500|income_2023|all.n: every country with both measures"
"Nothing." = "flip density_1500|income_2023|all: r = +0.04, t = +0.45"
"tells you nothing about where it stands now" = "the reading a pooled r of +0.04 would invite"
"the nothing becomes two relationships" = "pooled +0.04 against -0.49 (94) and +0.28 (69)"
"only just clear of chance" = "flip density_1500|income_2023|never_colonised: t = +2.39 on 69"
"what caused the reversal" = "a refusal to make a causal claim"
"not the cause" = "the filter; licensed by interaction.t and the four-cell heat pattern; reviewed in rounds 2 to 4"
"it cannot produce a ranking that inverted" = "the filter, as above"
"that a climate story cannot see the colonial split" = "reports a refuted earlier claim; refuted in the next sentence by colonisation_vs_latitude.r"
"disqualified only if its effect also held steady" = "the filter, as above"
"because of how it shaped European settlement" = "describes AJR's settler-mortality explanation, attributed to the literature, not asserted"
"A cause can be older than the reversal and still produce it" = "a logical possibility; the example precedes it"
"nobody checks the rank" = "hyperbole about reader behaviour, not a data claim"
"institutions caused the reversal" = "a refusal to make a causal claim"
'nobody should read "the split determines the sign" as a causal statement' = "a reading instruction that disclaims the causal reading of the quoted phrase"
"cannot mean what it looks like, because among former colonies that same thermometer used to point the other way" = "the close; heat_reversal former_colonies +0.29 then against -0.25 now, and the filter"
"Whatever explains today's map has to explain that inversion too, and an explanation whose effect never changed and never depended on whether Europeans arrived cannot" = "the filter restated: an effect constant over time and identical across the colonial split cannot invert the ranking within one group (interaction.t)"
