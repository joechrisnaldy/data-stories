# Gate configuration for Post 25. Run from Projects/analytics-blog:  python3 -m gate reversal-of-fortune
[post]
slug = "the-map-used-to-run-the-other-way"
source = "draft/the-map-used-to-run-the-other-way.src.md"
rendered = "draft/the-map-used-to-run-the-other-way.md"
results = "results.json"
sources = "docs/sources.json"
build = ["build_analysis.py"]
charts = "make_charts.py"
chart_dir = "charts"
docx = "draft/the-map-used-to-run-the-other-way.docx"
