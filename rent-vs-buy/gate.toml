# ---------------------------------------------------------------------------------------------------
# [published]: templates for the MDX front matter and each chart's alt text, written with the draft.
[published]
"seoTitle" = "Kiyosaki Was Half Right About Your House - Jonathan Chrisnaldy"
"excerpt" = "Over {{headline.30.all.h:int}} years, a US renter who invested the buyer's down payment and buying costs, then the monthly difference, beat the buyer of the same home in {{headline.30.all.rent:int}} of {{headline.30.all.n:int}} start years under both of my rent estimates; in the other {{headline.30.all.depends:words}}, it depends on the estimate. The house was still an asset, just slower than the fund. So was Kiyosaki right that a house is a liability? Half right."
"metaDescription" = "Buy a home, or rent the same home and invest the difference? I raced a buyer against a renter on US data for each start year from {{rules.first_start:year}} to {{rules.last_start:year}}, counting the costs of owning, and followed both for up to {{rules.max_h:int}} years."
"alt:rb-1-monthly-split.png" = "Line chart, start years {{split.summary.first_start:year}} to {{split.summary.last_start:year}}, of the first-month rent of the same home as a percent of the buyer's first-month outlay, under rent levels A and B. Level A runs from {{split.summary.a.min_pct:dec1}} percent in {{split.summary.a.min_start:year}} to {{split.summary.a.max_pct:dec1}} percent in {{split.summary.a.max_start:year}}, and level B from {{split.summary.b.min_pct:dec1}} percent in {{split.summary.b.min_start:year}} to {{split.summary.b.max_pct:dec1}} percent in {{split.summary.b.max_start:year}}. Both stay above a reference line at {{split.owner_example.share_pct:dec1}} percent, my example of {{split.owner_example.rent:int}} dollars of rent against {{split.owner_example.outlay:int}} dollars of mortgage and fees."
"alt:rb-2-one-household.png" = "Line chart of the net worth of the {{household.start:year}} buyer and renter at each December from {{household.first_year:year}} to {{household.last_year:year}}, in {{household.dollars_year:year}} dollars, under rent levels A and B. By December {{household.last_year:year}} the buyer has {{household.last.a.buyer:round0}} dollars under level A and {{household.last.b.buyer:round0}} under level B, and the renter, whose line is far bumpier, has {{household.last.a.renter:round0}} and {{household.last.b.renter:round0}}."
"alt:rb-3-who-is-ahead.png" = "Grid chart of the verdict (buy, rent, or depends on the rent) for each start year from {{rules.first_start:year}} to {{rules.last_start:year}} and each number of years held, up to {{rules.max_h:int}}; buy or rent means both rent levels agree. After {{headline.30.all.h:int}} years the verdict is rent in {{headline.30.all.rent:int}} of {{headline.30.all.n:int}} start years and buy in none; after {{headline.5.all.h:int}} years it is buy in {{headline.5.all.buy:int}} of {{headline.5.all.n:int}}."
"alt:rb-4-share-to-tie.png" = "Line chart of the share of each monthly gap the renter must invest to tie the buyer after {{rules.max_h:int}} years, start years {{share_to_tie.30.summary.first_start:year}} to {{share_to_tie.30.summary.last_start:year}}, under rent levels A and B. Under level A the share is {{rules.tie_floor_share:pct0}} percent in {{share_to_tie.30.summary.a.zero:int}} of {{share_to_tie.30.summary.n:int}} start years. Under level B it is {{rules.tie_floor_share:pct0}} percent in {{share_to_tie.30.summary.b.zero:int}} and less than half in {{share_to_tie.30.summary.b.below_half:int}}, and in {{share_to_tie.30.summary.b.cannot tie:words}} the renter cannot tie even by investing the whole gap."
